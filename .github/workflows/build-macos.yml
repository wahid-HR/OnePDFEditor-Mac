name: Build macOS APP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS .app
        run: |
          pyinstaller --noconfirm OfflinePDFEditor-mac.spec

      - name: List dist
        run: |
          ls -la dist
          ls -la dist/OnePDFEditor.app/Contents/MacOS || true

      - name: Zip the app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent OnePDFEditor.app OnePDFEditor-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePDFEditor-macOS
          path: dist/OnePDFEditor-macOS.zip
          if-no-files-found: error
          retention-days: 14
